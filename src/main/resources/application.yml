spring:
  datasource:
    url: jdbc:h2:mem:exittrading;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Kolkata

server:
  servlet:
    session:
      cookie:
        http-only: true
  error:
    include-message: always

logging:
  level:
    root: INFO
    com.exittrading: DEBUG
    ticker: INFO
  file:
    name: logs/exittrading.log

kite:
  apiKey: 12lhsd5n9elnyupj
  apiSecret: 55eaoudfzhyogeqp68xnhkaingpv6dsd
  default:
    exchange: BSE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

auction:
  detector:
    levels: 3
    windowSec: 90
    ewmaHalfLifeSec: 20
    scoreTrigger: 2.2
    swingConfirm: 0.30
    nearLtpBps: 15
    actionWindowStartSec: 300
    safetySec: 45

# Configurable PCA session slots (HH:mm). If omitted, fallback to built-in enum.
pca:
  slots:
    - "09:30"
    - "10:30"
    - "11:30"
    - "12:30"
    - "13:30"
    - "14:30"
