<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exit Trading PCA Console</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/css/dashboard.css" />
</head>

<body class="bg-dark text-light">
    <div class="container-fluid py-4">
        <div class="app-sticky">
            <div class="app-header d-flex justify-content-between align-items-center mb-4 px-3 py-2 rounded">
                <h1 class="h3 mb-0">PCA Flow Scheduler</h1>
                <div class="d-flex align-items-center gap-3 status-wrap">
                    <div class="d-flex align-items-center gap-2">
                        <div id="session-status" class="badge bg-secondary">Checking session...</div>
                        <small id="session-eta" class="text-muted"></small>
                    </div>
                    <button id="shutdown-btn" class="btn btn-sm btn-outline-danger shutdown-btn"
                        data-bs-toggle="tooltip" data-bs-placement="bottom"
                        data-bs-custom-class="tooltip-professional"
                        title="Gracefully stop the application">
                        <i class="bi bi-power"></i>
                    </button>
                </div>
            </div>
            <ul class="nav nav-tabs et-tab-nav mt-3" id="dashboard-tabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="tab-dashboard-link" data-bs-toggle="tab"
                        data-bs-target="#tab-dashboard" type="button" role="tab" aria-controls="tab-dashboard"
                        aria-selected="true">
                        <i class="bi bi-grid-1x2-fill me-1"></i>Dashboard
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-holdings-link" data-bs-toggle="tab" data-bs-target="#tab-holdings"
                        type="button" role="tab" aria-controls="tab-holdings" aria-selected="false">
                        <i class="bi bi-briefcase me-1"></i>Holdings & Depth
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-logging-link" data-bs-toggle="tab" data-bs-target="#tab-logging"
                        type="button" role="tab" aria-controls="tab-logging" aria-selected="false">
                        <i class="bi bi-journal-text me-1"></i>Logging Scrips
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-screener-link" data-bs-toggle="tab" data-bs-target="#tab-screener"
                        type="button" role="tab" aria-controls="tab-screener" aria-selected="false">
                        <i class="bi bi-funnel-fill me-1"></i>Screener
                    </button>
                </li>
                <li class="nav-item ms-auto" role="presentation">
                    <button class="nav-link" id="tab-settings-link" data-bs-toggle="tab" data-bs-target="#tab-settings"
                        type="button" role="tab" aria-controls="tab-settings" aria-selected="false">
                        <i class="bi bi-gear me-1"></i>Settings
                    </button>
                </li>
            </ul>
        </div>

        <div class="tab-content pt-3">
            <th:block th:replace="~{fragments/dashboard/tab-dashboard :: tabDashboard}"></th:block>
            <th:block th:replace="~{fragments/dashboard/tab-holdings :: tabHoldings}"></th:block>
            <th:block th:replace="~{fragments/dashboard/tab-logging :: tabLogging}"></th:block>
            <th:block th:replace="~{fragments/dashboard/tab-screener :: tabScreener}"></th:block>
            <th:block th:replace="~{fragments/dashboard/tab-settings :: tabSettings}"></th:block>
        </div>
    </div>

    <th:block th:replace="~{fragments/dashboard/toast-container :: toastContainer}"></th:block>
    <th:block th:replace="~{fragments/dashboard/schedule-error-modal :: scheduleErrorModal}"></th:block>
    <th:block th:replace="~{fragments/dashboard/settings-panel :: settingsPanel}"></th:block>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/dashboard.js"></script>
</body>

</html>
