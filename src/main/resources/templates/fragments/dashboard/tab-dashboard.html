<div th:fragment="tabDashboard" class="tab-pane fade show active" id="tab-dashboard" role="tabpanel"
    aria-labelledby="tab-dashboard-link">
    <div class="row g-4">
        <!-- Left column -->
        <div class="col-lg-3 col-xl-3">
            <div class="card sidebar-card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title section-title"><i class="bi bi-sliders me-2"></i>Admin Console</h5>
                    <div class="bottom_padding"></div>
                    <div class="mb-3">
                        <h6 class="mb-2 text-muted">
                            <span data-bs-toggle="tooltip" data-bs-placement="right"
                                data-bs-custom-class="tooltip-professional"
                                title="Complete Kite login in browser to obtain request_token, then paste here.">
                                <i class="bi bi-plug me-1"></i>Kite Session
                            </span>
                        </h6>
                        <div class="d-grid gap-2 mb-2">
                            <a href="/external/login" class="btn btn-primary btn-sm" target="_blank"
                                id="kite-login-btn">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Generate Token
                            </a>
                            <button class="btn btn-outline-warning btn-sm" id="restore-session-btn"
                                style="display:none;" type="button">
                                <i class="bi bi-arrow-counterclockwise me-1"></i>Restore Session
                            </button>
                        </div>
                        <small class="text-muted">Use the Kite OAuth flow and set the redirect URL to
                            <span class="text-info">Kite Redirect</span>.</small>
                    </div>

                    <div class="mb-3">
                        <label for="user-selector" class="form-label">Impersonate User</label>
                        <div class="d-flex gap-2 align-items-center">
                            <select id="user-selector" class="form-select form-select-sm"
                                data-bs-toggle="tooltip" title="Impersonate user"></select>
                            <button id="sync-holdings-btn" class="btn btn-outline-info btn-sm" type="button"
                                data-bs-toggle="tooltip" title="Sync">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                            <button id="refresh-btn" class="btn btn-outline-light btn-sm" type="button"
                                data-bs-toggle="tooltip" title="Refresh">
                                <i class="bi bi-arrow-repeat"></i>
                            </button>
                        </div>
                    </div>

                    <hr class="border-light" />
                    <h5 class="card-title section-title"><i class="bi bi-calendar2-week"></i> Schedule</h5>
                    <div class="bottom_padding"></div>
                    <form id="schedule-form" class="needs-validation" novalidate>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label">Trading Symbol</label>
                                <input type="text" class="form-control" id="tradingsymbol"
                                    placeholder="e.g., INFY" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Instrument Token</label>
                                <input type="text" class="form-control" id="instrumentToken"
                                    placeholder="Numeric token" required />
                            </div>
                        </div>
                        <div class="row g-2 mt-1">
                            <div class="col-md-4">
                                <label class="form-label">Quantity</label>
                                <input type="number" class="form-control" id="quantity" min="1" required />
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Side</label>
                                <select class="form-select" id="side">
                                    <option value="SELL">SELL</option>
                                    <option value="BUY">BUY</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Session</label>
                                <select class="form-select" id="sessionSlot">
                                    <option value="SLOT_0930">09:30</option>
                                    <option value="SLOT_1030">10:30</option>
                                    <option value="SLOT_1130">11:30</option>
                                    <option value="SLOT_1230">12:30</option>
                                    <option value="SLOT_1330">13:30</option>
                                    <option value="SLOT_1430">14:30</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 mt-1">
                            <div class="col-md-6">
                                <label class="form-label">Trade Date (IST)</label>
                                <input type="date" class="form-control" id="tradeDate" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Limit Price (optional)</label>
                                <input type="number" class="form-control" id="limitPrice" step="0.01"
                                    placeholder="e.g., 1540.00" />
                            </div>
                        </div>
                        <div class="row g-2 mt-1 align-items-end">
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="manual-mode-toggle">
                                    <label class="form-check-label" for="manual-mode-toggle">Manual time
                                        (override session)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Manual Time (IST)</label>
                                <input type="time" class="form-control" id="manualTime" step="60"
                                    disabled />
                            </div>
                        </div>
                        <button class="btn btn-success btn-sm w-100 mt-2" type="submit"><i
                                class="bi bi-send me-1"></i>Schedule</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Right column -->
        <div class="col-lg-9 col-xl-9 dashboard-main">
            <div class="row g-4">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div
                            class="card-header bg-primary text-light d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Upcoming PCA Schedules</h5>
                            <button class="btn btn-sm btn-outline-light" id="retry-upcoming" title="Retry">
                                <i class="bi bi-arrow-repeat"></i>
                            </button>
                        </div>
                        <div class="card-body">
                            <div id="scheduled-list" class="row g-3"></div>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div
                            class="card-header bg-success text-light d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Executed Schedules</h5>
                            <button class="btn btn-sm btn-outline-light" id="retry-executed" title="Retry">
                                <i class="bi bi-arrow-repeat"></i>
                            </button>
                        </div>
                        <div class="card-body">
                            <div id="executed-list" class="row g-3"></div>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <!-- News panel -->
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title section-title"><i class="bi bi-newspaper me-2"></i>News</h5>
                            <div id="news-panel" class="news-panel text-light small">Loading news...</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
