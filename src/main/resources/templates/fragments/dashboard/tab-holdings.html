<div th:fragment="tabHoldings" class="tab-pane fade" id="tab-holdings" role="tabpanel"
    aria-labelledby="tab-holdings-link">
    <div class="container-fluid">
        <div class="row g-4">
            <div class="col-12">
                <!-- Holdings Card -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-warning d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Holdings</h5>
                        <button class="btn btn-sm btn-outline-dark" id="retry-holdings" title="Retry">
                            <i class="bi bi-arrow-repeat"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div class="text-muted small">Click a holding to preset a schedule (switches to
                                Dashboard)</div>
                            <div class="d-flex align-items-center gap-2 status-wrap">
                                <label for="holdings-exchange-filter"
                                    class="form-label mb-0 small">Exchange</label>
                                <select id="holdings-exchange-filter" class="form-select form-select-sm"
                                    style="width:auto">
                                    <option value="ALL">All</option>
                                    <option value="NSE">NSE</option>
                                    <option value="BSE">BSE</option>
                                </select>
                            </div>
                        </div>
                        <div id="holdings-list" class="d-flex flex-wrap gap-2"></div>
                    </div>
                </div>
                <!-- Market Depth Card -->
                <div class="card shadow-sm">
                    <div
                        class="card-header bg-info text-dark d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Market Depth</h5>
                        <button class="btn btn-sm btn-outline-dark" id="retry-depth" title="Retry">
                            <i class="bi bi-arrow-repeat"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="et-depth-slider">
                            <button class="btn btn-sm btn-outline-light et-nav" id="depth-prev"
                                title="Previous">
                                <i class="bi bi-chevron-left"></i>
                            </button>
                            <div class="et-depth-viewport">
                                <div id="depth-panels" class="et-depth-track"></div>
                            </div>
                            <button class="btn btn-sm btn-outline-light et-nav" id="depth-next"
                                title="Next">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
